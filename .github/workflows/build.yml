on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install MinGW x86-64 compiler
      run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Ensure input.jar exists
      run: |
        if [ ! -f input.jar ]; then
          echo "Creating empty fallback input.jar for build check"
          echo -n "PK00" > input.jar
        fi

    - name: Build DLL
      run: make build

    - name: Upload output.dll as artifact
      uses: actions/upload-artifact@v4
      with:
        name: output-x64.dll
        path: output.dll
        if-no-files-found: error
